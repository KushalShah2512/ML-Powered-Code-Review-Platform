<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - CodeReview.AI</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    
    <style>
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; transition: 0.4s; }
        .user-profile { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 40px; height: 40px; background: linear-gradient(135deg, #4facfe, #00f2fe); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #0f0c29; }
        .btn-upload { background: rgba(0,0,0,0.2); border: 1px solid #4facfe; padding: 10px 15px; border-radius: 8px; color: #4facfe; cursor: pointer; transition: 0.3s; }
        .btn-upload:hover { background: #4facfe; color: white; }
        textarea { width: 100%; height: 150px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; padding: 15px; font-family: 'JetBrains Mono', monospace; margin-bottom: 15px; outline: none; transition: 0.3s; }
        textarea:focus { border-color: #4facfe; }
        .btn-analyze { float: right; background: linear-gradient(to right, #4facfe, #00f2fe); border: none; padding: 12px 25px; border-radius: 8px; color: black; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-analyze:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(79, 172, 254, 0.3); }
        .history-table { width: 100%; border-collapse: collapse; text-align: left; transition: 0.4s; }
        .history-table th { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); font-weight: 500; font-size: 13px; text-transform: uppercase; }
        .history-table td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .status-badge { background: rgba(255, 107, 107, 0.1); color: #ff6b6b; padding: 5px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; }
        .status-badge.clean { background: rgba(0, 255, 136, 0.1); color: #00ff88; }
        .btn-delete { color: rgba(255,255,255,0.3); transition: 0.3s; }
        .btn-delete:hover { color: #ff6b6b; }

        /* Dashboard Light Mode Specifics */
        body.light-mode .header { color: #1e293b; }
        body.light-mode .avatar { color: white; }
        body.light-mode textarea { background: #ffffff; border: 1px solid #cbd5e1; color: #1e293b; }
        body.light-mode .btn-upload { background: #f8fafc; }
        body.light-mode .history-table th { color: #64748b; border-bottom-color: rgba(0,0,0,0.1); }
        body.light-mode .history-table td { border-bottom-color: rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">CodeReview<span>.AI</span></div>
        <a href="/dashboard" class="menu-item active"><i class="fas fa-code"></i> New Review</a>
        <a href="/history" class="menu-item"><i class="fas fa-history"></i> History</a>
        <a href="/profile" class="menu-item"><i class="fas fa-user-circle"></i> Profile</a>
        
        <div style="flex: 1;"></div>
        
        <button onclick="toggleTheme()" class="menu-item theme-toggle-btn" style="width: 100%; border: none; background: transparent; cursor: pointer; text-align: left; font-family: inherit;">
            <i class="fas fa-sun"></i> Light Mode
        </button>

        <a th:href="@{/logout}" class="menu-item"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h2 style="font-weight: 400;">Welcome back, <b th:text="${session.loggedInUser != null ? session.loggedInUser.username : 'Developer'}">Developer</b></h2>
            <div class="user-profile">
                <span style="font-size: 14px; color: rgba(255,255,255,0.7);" th:text="${session.loggedInUser != null ? session.loggedInUser.username : 'User'}">User</span>
                <div class="avatar" th:text="${session.loggedInUser != null ? session.loggedInUser.username.substring(0,1).toUpperCase() : 'U'}">U</div>
            </div>
        </div>

        <div style="display: flex; gap: 20px; margin-bottom: 30px;">
            <div class="glass-panel" style="flex: 1; margin-bottom: 0; min-height: 280px; display: flex; flex-direction: column; align-items: center;">
                 <h3 style="font-weight: 600; font-size: 16px; margin-bottom: 10px; align-self: flex-start;">Vulnerability Analysis</h3>
                 <div style="width: 100%; height: 180px; position: relative;">
                    <canvas id="vulnChart"></canvas>
                 </div>
            </div>
            
            <div class="glass-panel" style="flex: 1; margin-bottom: 0; display: flex; flex-direction: column; justify-content: center;">
                 <h3 style="font-weight: 600; font-size: 18px; margin-bottom: 20px;">System Health</h3>
                 <p style="margin-bottom: 10px; color: rgba(255,255,255,0.7);">Total Scans: <strong style="color: white; font-size: 1.2em;" th:text="${totalScans}">0</strong></p>
                 <p style="margin-bottom: 10px; color: #ff6b6b;">Issues Found: <strong th:text="${issueCount}">0</strong></p>
                 <p style="color: #00ff88;">Clean Code: <strong th:text="${safeCount}">0</strong></p>
            </div>
        </div>

        <div class="glass-panel">
            <h3 style="font-weight: 600; font-size: 18px; margin-bottom: 15px;">Analyze Source Code</h3>
            
            <div style="background: rgba(255,255,255,0.03); padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px dashed rgba(255,255,255,0.2);">
                <h4 style="color: #4facfe; margin-bottom: 10px; font-size: 14px;">Option 1: Upload File</h4>
                <form action="/analyze-file" method="POST" enctype="multipart/form-data" style="display: flex; gap: 10px; align-items: center;">
                    <input type="file" name="file" accept=".java,.py,.txt" style="color: white; font-size: 13px;" required>
                    <button type="submit" class="btn-upload"><i class="fas fa-upload"></i> Upload & Analyze</button>
                </form>
            </div>

            <h4 style="color: #4facfe; font-size: 14px;">Option 2: Paste Code</h4>
            <form action="/analyze" method="POST">
                <textarea name="codeContent" placeholder="// Paste code here..." required></textarea>
                <button type="submit" class="btn-analyze"><i class="fas fa-robot"></i> Run Analysis</button>
            </form>
            <div style="clear: both;"></div> 
        </div>

        <div class="glass-panel">
            <h3 style="font-weight: 600; font-size: 18px; margin-bottom: 20px;">Recent Scans</h3>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>File ID</th>
                        <th>Analysis Result</th>
                        <th style="text-align: right;">Action</th>
                    </tr>
                </thead>
                <tbody id="history-body">
                   <tr><td colspan="3" style="text-align: center; color: rgba(255,255,255,0.3);">Loading data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script th:inline="javascript">
        // 1. CHART JS CONFIGURATION
        var safeData = [[${safeCount}]];
        var issueData = [[${issueCount}]];

        // Check if data is null (first run), default to 1/0 so chart shows something empty
        if (safeData == null) safeData = 0;
        if (issueData == null) issueData = 0;

        var ctx = document.getElementById('vulnChart').getContext('2d');
        var myChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Safe Code', 'Vulnerabilities'],
                datasets: [{
                    data: [safeData, issueData],
                    backgroundColor: ['#00ff88', '#ff6b6b'], // Green and Red
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'right', labels: { color: 'white', font: { size: 11 } } }
                }
            }
        });

        // 2. FETCH HISTORY TABLE
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/api/history')
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.getElementById("history-body");
                    tableBody.innerHTML = ""; 

                    if (!data || data.length === 0) {
                        tableBody.innerHTML = "<tr><td colspan='3' style='text-align:center; padding:30px; color:rgba(255,255,255,0.3);'>No history found. Start analyzing!</td></tr>";
                        return;
                    }

                    // Limit to last 5 entries for Dashboard
                    const recentData = data.slice(-5).reverse(); 

                    recentData.forEach(file => {
                        let badgeClass = "status-badge";
                        let feedbackText = file.feedback ? file.feedback : "Pending";
                        
                        if (feedbackText.toLowerCase().includes("clean") || feedbackText.includes("100")) {
                            badgeClass += " clean";
                        }
	
                     // Limit code preview to 300 characters so it doesn't break the table height
                        // Limit code preview to 300 characters so it doesn't break the table height
                        let codePreview = file.content ? file.content.substring(0, 300) : "";
                        if (file.content && file.content.length > 300) codePreview += "\n// ... code continues ...";

                        const row = `
                            <tr>
                                <td style="font-family: monospace; color: #4facfe; vertical-align: top; width: 15%; padding-right: 15px;">
                                    #${file.id}<br>
                                    <span style="font-size: 11px; color: rgba(255,255,255,0.4); word-break: break-all;">${file.fileName}</span>
                                </td>
                                
                                <td style="width: 70%; vertical-align: top; padding-right: 15px;">
                                    <div style="max-width: 100%; overflow-x: auto; margin-bottom: 12px;">
                                        <pre style="margin: 0; border-radius: 8px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);"><code style="border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 15px;">${escapeHTML(codePreview)}</code></pre>
                                    </div>
                                    <div class="${badgeClass}" style="display: inline-block; font-size: 12px; padding: 6px 12px;">
                                        <i class="fas fa-robot"></i> ${feedbackText}
                                    </div>
                                </td>

                                <td style="vertical-align: top; width: 15%; text-align: right; white-space: nowrap;">
                                    <a href="/download-pdf/${file.id}" class="btn-outline" style="padding: 7px 12px; font-size: 13px; margin-right: 5px; text-decoration: none; display: inline-block;" title="Download PDF">
                                        <i class="fas fa-file-pdf"></i>
                                    </a>
                                    <a href="/delete-file?id=${file.id}" class="btn-danger" style="padding: 7px 12px; font-size: 13px; text-decoration: none; display: inline-block; width: auto;" title="Delete" onclick="return confirm('Are you sure?')">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        `;
                        tableBody.innerHTML += row;
                    });
                 // Tell Highlight.js to colorize the new code blocks!
                    document.querySelectorAll('pre code').forEach((block) => {
                        hljs.highlightElement(block);
                    });
                })
                .catch(error => console.error('Error:', error));
        });
        
     // Helper function to safely display code symbols like < and >
        function escapeHTML(str) {
            if (!str) return "";
            return str.replace(/[&<>'"]/g, function(tag) {
                const charsToReplace = {
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
                };
                return charsToReplace[tag] || tag;
            });
        }
    </script>
    
    <script th:src="@{/js/theme.js}"></script>
    
</body>
</html>
