<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My History - CodeReview.AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

    <style>
        body { background: #0f0c29; color: white; font-family: 'Inter', sans-serif; display: flex; height: 100vh; margin: 0; }
        
        /* SIDEBAR */
        .sidebar { width: 250px; background: rgba(255, 255, 255, 0.05); padding: 30px; display: flex; flex-direction: column; }
        .brand { font-size: 24px; font-weight: bold; margin-bottom: 50px; color: white; text-decoration: none;}
        .brand span { color: #4facfe; }
        .nav-link { color: rgba(255,255,255,0.7); text-decoration: none; padding: 15px 0; display: flex; align-items: center; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { color: #4facfe; }
        .nav-link i { margin-right: 15px; width: 20px; text-align: center; }
        
        /* MAIN CONTENT */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 15px; color: rgba(255,255,255,0.4); font-size: 12px; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1); }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: top; font-size: 14px; }
        
        .feedback-text { color: #ffeb3b; font-size: 13px; display: block; max-width: 300px;}
        
        /* BUTTON STYLES */
        .btn-delete { color: #ff6b6b; cursor: pointer; text-decoration: none; transition: 0.2s; }
        .btn-delete:hover { color: red; transform: scale(1.1); }
        
        .btn-download { color: #4facfe; cursor: pointer; text-decoration: none; margin-right: 15px; transition: 0.2s; }
        .btn-download:hover { color: #00f2fe; transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="sidebar">
        <a href="/dashboard" class="brand">CodeReview<span>.AI</span></a>
        <a href="/dashboard" class="nav-link"><i class="fas fa-code"></i> New Review</a>
        <a href="/history" class="nav-link active"><i class="fas fa-history"></i> History</a> 
        <a href="/profile" class="nav-link"><i class="fas fa-user"></i> Profile</a>
        <a href="/logout" class="nav-link" style="margin-top: auto;"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>

    <div class="main-content">
        <h2 style="margin-bottom: 10px;">Full Scan History</h2>
        <p style="color: rgba(255,255,255,0.5); margin-bottom: 30px;">A complete record of all your code submissions.</p>

        <div th:if="${files.empty}" style="padding: 40px; text-align: center; background: rgba(255,255,255,0.05); border-radius: 10px;">
            <p>No history found. Go to "New Review" to scan your first code!</p>
        </div>

        <table th:if="${!files.empty}">
            <thead>
                <tr>
                    <th style="width: 15%;">Date / ID</th>
                    <th style="width: 45%;">Code Snippet</th>
                    <th style="width: 30%;">AI Feedback</th>
                    <th style="width: 10%;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="file : ${files}">
                    <td>
                        <div style="font-weight: bold;" th:text="${file.fileName}">Snippet_Date</div>
                        <div style="font-size: 12px; opacity: 0.6;" th:text="'#' + ${file.id}">#12</div>
                    </td>
                    
                    <td>
                        <pre style="margin: 0; padding: 10px; border-radius: 6px; background: #2d2d2d; max-height: 150px; overflow: auto; font-size: 12px;">
                            <code class="language-java" th:text="${file.content}"></code>
                        </pre>
                    </td>
                    
                    <td>
                        <span class="feedback-text" th:text="${file.feedback}">Clean Code...</span>
                    </td>
                    
                    <td>
                        <a th:href="@{/download-pdf/{id}(id=${file.id})}" class="btn-download" title="Download Report">
                            <i class="fas fa-file-pdf"></i>
                        </a>
                        <a th:href="@{/delete-file(id=${file.id})}" class="btn-delete" onclick="return confirm('Delete this record?');" title="Delete">
                            <i class="fas fa-trash"></i>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>

</body>
</html>
