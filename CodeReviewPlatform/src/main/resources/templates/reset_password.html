<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Set New Password - CodeReview.AI</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: white; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        .logo { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; margin-bottom: 20px; color: white; }
        .logo span { color: #4facfe; }

        h2 { font-weight: 400; margin-bottom: 10px; font-size: 20px; }
        p { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 25px; line-height: 1.5; }

        input[type="password"] {
            width: 100%; padding: 14px 20px; background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
            color: white; margin-bottom: 15px; font-size: 14px; outline: none; transition: 0.3s;
        }
        input[type="password"]:focus { border-color: #a8ff78; }

        .btn-success {
            width: 100%; background: linear-gradient(to right, #a8ff78, #78ffd6);
            border: none; padding: 14px; border-radius: 8px; color: black;
            font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 15px; margin-top: 10px;
        }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(168, 255, 120, 0.3); }
        
        .security-badge {
            background: rgba(0,0,0,0.2); padding: 8px 15px; border-radius: 20px; 
            font-size: 11px; color: #a8ff78; display: inline-block; margin-bottom: 20px; border: 1px solid rgba(168,255,120,0.2);
        }
    </style>
</head>
<body>

    <div class="glass-panel">
        <div class="logo">CodeReview<span>.AI</span></div>
        <h2><i class="fas fa-key" style="color: #a8ff78;"></i> Set New Password</h2>
        <p>Please enter your new secure password below.</p>
        
        <div class="security-badge"><i class="fas fa-shield-check"></i> Secure Token Verified</div>
        
        <form action="/reset-password" method="POST">
            <input type="hidden" name="token" th:value="${token}">
            
            <input type="password" name="newPassword" placeholder="New Password (min 6 chars)" required minlength="6">
            
            <button type="submit" class="btn-success">Update Password & Login</button>
        </form>
    </div>

</body>
</html>
