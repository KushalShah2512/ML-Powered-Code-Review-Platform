<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - CodeReview.AI</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: white; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        .logo { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; margin-bottom: 20px; color: white; }
        .logo span { color: #4facfe; }

        h2 { font-weight: 400; margin-bottom: 10px; font-size: 20px; }
        p { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 25px; line-height: 1.5; }

        input[type="email"] {
            width: 100%; padding: 14px 20px; background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
            color: white; margin-bottom: 20px; font-size: 14px; outline: none; transition: 0.3s;
        }
        input[type="email"]:focus { border-color: #4facfe; }

        .btn-primary {
            width: 100%; background: linear-gradient(to right, #4facfe, #00f2fe);
            border: none; padding: 14px; border-radius: 8px; color: black;
            font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 15px;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(79, 172, 254, 0.3); }

        .back-link {
            display: inline-block; margin-top: 20px; color: rgba(255,255,255,0.5);
            text-decoration: none; font-size: 13px; transition: 0.3s;
        }
        .back-link:hover { color: #4facfe; }
    </style>
</head>
<body>

    <div class="glass-panel">
        <div class="logo">CodeReview<span>.AI</span></div>
        <h2><i class="fas fa-unlock-alt" style="color: #4facfe;"></i> Password Recovery</h2>
        <p>Enter the email address associated with your account and we will send you a secure reset token.</p>
        
        <form action="/forgot-password" method="POST">
            <input type="email" name="email" placeholder="Enter your email address" required>
            <button type="submit" class="btn-primary">Send Reset Link</button>
        </form>
        
        <a href="/login" class="back-link"><i class="fas fa-arrow-left"></i> Back to Login</a>
    </div>

</body>
</html>
