# MySQL Connection (Cloud-ready with local fallback)
spring.datasource.url=${SPRING_DB_URL:jdbc:mysql://localhost:3306/code_review_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DB_USERNAME:root}
spring.datasource.password=${SPRING_DB_PASSWORD:root}

# Python AI Engine Connection (Cloud-ready with local fallback)
ai.engine.url=${AI_ENGINE_URL:http://127.0.0.1:5000}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Increase maximum file upload size for Profile Pictures
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
